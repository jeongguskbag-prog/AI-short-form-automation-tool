<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보관함</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='3' y='9' width='26' height='19' rx='3' fill='%2382c91e'/><rect x='10' y='4' width='12' height='6' rx='2' fill='none' stroke='%2382c91e' stroke-width='2.5'/></svg>">
<style>
  :root {
    --bg: #f4f5f2;
    --surface: #ffffff;
    --surface-2: #eceee8;
    --border: #dcdfd5;
    --text: #15170f;
    --muted: #63675a;
    --accent: #4f8a00;
    --accent-ink: #ffffff;
    --accent-soft: #e7f3d4;
    --focus: #6fb400;
    --badge-bg: rgba(10, 12, 6, .78);
    --badge-text: #d9ff6b;
    --err: #c62f3b;
    --err-soft: #fde8ea;
    --warn: #8a5a00;
    --warn-soft: #fff3d6;
    --radius: 12px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0e0b;
      --surface: #16180f;
      --surface-2: #1f2218;
      --border: #2f3326;
      --text: #eef0e8;
      --muted: #9ba090;
      --accent: #c6f432;
      --accent-ink: #11140a;
      --accent-soft: #283312;
      --focus: #d4ff3f;
      --err: #ff7a85;
      --err-soft: #3a1a1e;
      --warn: #f2c063;
      --warn-soft: #33290f;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  }
  a { color: inherit; }
  .app { display: grid; grid-template-columns: 84px minmax(0, 1fr); min-height: 100vh; }

  /* 왼쪽 메뉴 */
  nav.side {
    border-right: 1px solid var(--border); background: var(--surface);
    display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 0;
    position: sticky; top: 0; height: 100vh;
  }
  nav.side a, nav.side span {
    width: 68px; padding: 10px 0; border-radius: 10px; text-decoration: none;
    display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted);
  }
  nav.side svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  nav.side a:hover { background: var(--surface-2); color: var(--text); }
  nav.side a[aria-current=page] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  nav.side span[aria-disabled] { opacity: .45; cursor: default; }

  main { padding: 24px 24px 64px; max-width: 1280px; width: 100%; }
  h1 { font-size: 22px; margin: 0 0 18px; letter-spacing: -.01em; }

  /* 필터 바 */
  .filters { display: grid; grid-template-columns: 220px minmax(280px, 320px) 180px minmax(200px, 1fr); gap: 14px; align-items: end; }
  .filters label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  select, input[type=search], input[type=password] {
    width: 100%; height: 48px; font: inherit; font-size: 16px; color: inherit;
    background: var(--surface-2); border: 2px solid var(--border); border-radius: 10px; padding: 0 14px; outline: none;
  }
  select { appearance: none; padding-right: 40px; cursor: pointer;
    background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2.5' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat: no-repeat; background-position: right 12px center; background-size: 18px; }
  select:focus, input:focus, .seg button:focus-visible, .btn:focus-visible, .star:focus-visible {
    border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 35%, transparent); outline: none;
  }
  .seg { display: flex; height: 48px; border: 2px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface-2); }
  .seg button {
    flex: 1; min-width: 64px; font: inherit; font-size: 15px; border: 0; background: transparent; color: var(--muted);
    cursor: pointer; padding: 0 10px; border-radius: 0; white-space: nowrap;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .help { color: var(--muted); font-size: 13px; margin: 10px 0 0; }

  /* 결과 요약 줄 */
  .summary { margin: 22px 0 14px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); }
  .summary .head { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .summary .actions { float: right; }
  .btn {
    font: inherit; font-size: 13px; font-weight: 700; border-radius: 9px; cursor: pointer; text-decoration: none;
    padding: 8px 14px; border: 2px solid var(--border); background: var(--surface); color: var(--text); display: inline-block;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* 카드 그리드 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
  .card.fav { border-color: var(--accent); }
  .thumb { position: relative; aspect-ratio: 9 / 16; background: var(--surface-2); display: block; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge {
    position: absolute; top: 8px; left: 8px; padding: 3px 8px; border-radius: 7px;
    background: var(--badge-bg); color: var(--badge-text); font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums;
  }
  .badge.none { color: #cfcfcf; font-weight: 600; font-size: 12px; }
  .star {
    position: absolute; top: 6px; right: 6px; width: 38px; height: 38px; border-radius: 50%;
    border: 2px solid transparent; background: var(--badge-bg); cursor: pointer; display: grid; place-items: center;
  }
  .star svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 2; fill: none; }
  .star[aria-pressed=true] svg { fill: #ffd43b; stroke: #ffd43b; }
  .cat { position: absolute; bottom: 8px; left: 8px; font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--badge-bg); color: #fff; }
  .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .title { font-weight: 700; font-size: 14px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--text); font-weight: 700; }
  .sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .btn { margin-top: auto; text-align: center; }

  .notice { border-radius: 10px; padding: 14px 16px; font-size: 14px; margin: 16px 0; background: var(--surface); border: 1px solid var(--border); }
  .notice.err { background: var(--err-soft); color: var(--err); border-color: transparent; }
  .notice.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .notice h2 { font-size: 16px; margin: 0 0 8px; color: var(--text); }
  .notice ol { margin: 6px 0 0; padding-left: 20px; }
  .notice code { background: var(--surface-2); padding: 1px 6px; border-radius: 5px; }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; }
  .key-row { display: flex; gap: 8px; margin-top: 8px; }

  @media (max-width: 900px) {
    .filters { grid-template-columns: 1fr 1fr; }
    .filters .f-period, .filters .f-q { grid-column: 1 / -1; }
  }
  @media (max-width: 640px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    nav.side { position: sticky; top: 0; z-index: 5; height: auto; flex-direction: row; justify-content: space-around; padding: 6px 4px; border-right: 0; border-bottom: 1px solid var(--border); }
    nav.side a, nav.side span { width: auto; flex: 1; padding: 6px 0; }
    main { padding: 16px 16px 48px; }
    .filters { grid-template-columns: minmax(0, 1fr); }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .summary .actions { float: none; display: block; margin-top: 8px; }
  }

  /* 보관함 */
  .lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
  .lib-card { all: unset; cursor: pointer; display: flex; flex-direction: column; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .lib-card:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .lib-card[aria-current=true] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .lib-thumb { aspect-ratio: 9 / 16; background: var(--surface-2); }
  .lib-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lib-card .body { padding: 10px 12px 12px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
  .detail { position: sticky; top: 16px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; }
  .detail video { width: 100%; aspect-ratio: 9 / 16; border-radius: 10px; background: #000; display: block; }
  .detail h2 { font-size: 17px; margin: 12px 0 2px; }
  .detail h3 { font-size: 13px; color: var(--muted); margin: 16px 0 6px; }
  .detail .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .detail .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .detail .thumbs a { aspect-ratio: 9 / 16; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); display: block; }
  .detail .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .detail textarea { width: 100%; min-height: 120px; font: inherit; font-size: 13px; color: inherit; resize: vertical;
    background: var(--surface-2); border: 2px solid var(--border); border-radius: 10px; padding: 10px; }
  .detail ol { margin: 0; padding-left: 20px; font-size: 14px; }
  .btn.danger { color: var(--err); }
  .meta { color: var(--muted); font-size: 12px; }
  @media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } .detail { position: static; } }
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="메뉴">
    <a href="/trends">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>아이템 찾기
    </a>
    <a href="/">
      <svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>영상 만들기
    </a>
    <a href="/library" aria-current="page">
      <svg viewBox="0 0 24 24"><path d="M3 7h18v13H3z"/><path d="M8 7V4h8v3"/></svg>보관함
    </a>
    <span aria-disabled="true" title="준비 중">
      <svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-6z"/></svg>배포
    </span>
  </nav>

  <main>
    <h1>보관함</h1>
    <p class="help" style="margin-top:-8px">완성된 영상이 자동으로 저장돼요. 보관 기간이 지나면(기본 30일) 지워지니 필요한 영상은 내려받아 두세요.</p>

    <div id="key-section" class="notice" hidden>
      <h2>API 키</h2>
      이 서버는 API 키가 있어야 쓸 수 있습니다. 키는 이 브라우저에만 저장됩니다.
      <div class="key-row">
        <input id="api-key" type="password" autocomplete="off" placeholder="API 키 붙여넣기">
        <button id="key-save" class="btn primary" type="button">확인</button>
      </div>
    </div>
    <div id="error" class="notice err" hidden></div>

    <div class="layout" style="margin-top:16px">
      <div>
        <div class="lib-grid" id="grid" aria-label="저장된 영상"></div>
        <div class="empty" id="empty" hidden>아직 저장된 영상이 없어요. <a href="/">영상 만들기</a>에서 첫 영상을 만들어 보세요.</div>
      </div>
      <aside class="detail" id="detail" hidden aria-live="polite">
        <video id="d-video" controls playsinline preload="metadata"></video>
        <h2 id="d-title"></h2>
        <div class="meta" id="d-meta"></div>
        <div class="row">
          <a class="btn primary" id="d-download" download>영상 내려받기</a>
          <button class="btn danger" type="button" id="d-delete">삭제</button>
        </div>
        <div id="d-thumbs-wrap">
          <h3>썸네일 · 눌러서 저장</h3>
          <div class="thumbs" id="d-thumbs"></div>
        </div>
        <div id="d-titles-wrap">
          <h3>제목 후보</h3>
          <ol id="d-titles"></ol>
        </div>
        <div id="d-desc-wrap">
          <h3>설명란</h3>
          <textarea id="d-desc" readonly aria-label="설명란"></textarea>
          <div class="row"><button class="btn" type="button" id="d-copy">설명란 복사</button></div>
        </div>
        <h3>대본</h3>
        <textarea id="d-script" readonly aria-label="대본"></textarea>
        <div class="meta" id="d-credits"></div>
      </aside>
    </div>
  </main>
</div>

<script>
(() => {
  const API_KEY_STORAGE = "shorts.apiKey.v1";
  const $ = (id) => document.getElementById(id);
  let current = null;  // 지금 열어 둔 프로젝트 (링크 만료 시 다시 받기용)

  try { $("api-key").value = localStorage.getItem(API_KEY_STORAGE) || ""; } catch {}
  function authHeaders() {
    const key = $("api-key").value.trim();
    return key ? { "X-API-Key": key } : {};
  }
  function showError(msg) { $("error").hidden = !msg; $("error").textContent = msg || ""; }
  function fmtDate(iso) {
    const d = new Date(iso), pad = (x) => String(x).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function safeName(s) { return (s || "video").replace(/[\\/:*?"<>|]/g, "_"); }

  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), ...authHeaders() } });
    if (res.status === 401) { $("key-section").hidden = false; $("api-key").focus(); throw new Error("API 키가 필요해요."); }
    const body = await res.json().catch(() => null);
    if (!res.ok) throw new Error((body && body.detail) || `HTTP ${res.status}`);
    $("key-section").hidden = true;
    return body;
  }

  async function loadList() {
    try {
      const { items } = await api("/api/v1/projects");
      showError("");
      $("empty").hidden = items.length > 0;
      $("grid").replaceChildren(...items.map((p) => {
        const card = document.createElement("button");
        card.type = "button"; card.className = "lib-card"; card.dataset.id = p.project_id;
        const thumb = document.createElement("div"); thumb.className = "lib-thumb";
        if (p.thumbnail_url) { const img = document.createElement("img"); img.src = p.thumbnail_url; img.alt = ""; img.loading = "lazy"; thumb.append(img); }
        const body = document.createElement("div"); body.className = "body";
        const title = document.createElement("div"); title.className = "title"; title.textContent = p.title;
        const sub = document.createElement("div"); sub.className = "sub";
        sub.textContent = [p.product_name, p.duration_sec ? `${p.duration_sec.toFixed(0)}초` : "", fmtDate(p.created_at)].filter(Boolean).join(" · ");
        body.append(title, sub);
        card.append(thumb, body);
        card.addEventListener("click", () => openDetail(p.project_id));
        return card;
      }));
      const wanted = current?.project_id || new URLSearchParams(location.search).get("id");
      if (wanted && items.some((p) => p.project_id === wanted)) openDetail(wanted);
    } catch (err) {
      showError(err instanceof TypeError ? "서버에 연결할 수 없어요." : "불러오지 못했어요: " + err.message);
    }
  }

  async function openDetail(id) {
    try {
      const p = await api(`/api/v1/projects/${encodeURIComponent(id)}`);
      current = p;
      for (const c of $("grid").children) c.setAttribute("aria-current", String(c.dataset.id === id));
      if ($("d-video").getAttribute("src") !== p.video_url) $("d-video").src = p.video_url;
      $("d-title").textContent = p.title;
      $("d-meta").textContent = [p.product_name, p.scene_count ? `${p.scene_count}개 씬` : "",
        p.duration_sec ? `${p.duration_sec.toFixed(1)}초` : "", fmtDate(p.created_at)].filter(Boolean).join(" · ");
      $("d-download").href = p.video_url;
      $("d-download").download = `${safeName(p.title)}.mp4`;
      $("d-thumbs").replaceChildren(...p.thumbnail_urls.map((u, i) => {
        const a = document.createElement("a"); a.href = u; a.download = `${safeName(p.title)}_썸네일${i + 1}.jpg`;
        const img = document.createElement("img"); img.src = u; img.alt = `썸네일 ${i + 1}안`; a.append(img);
        return a;
      }));
      $("d-thumbs-wrap").hidden = !p.thumbnail_urls.length;
      $("d-titles").replaceChildren(...p.titles.map((t) => { const li = document.createElement("li"); li.textContent = t; return li; }));
      $("d-titles-wrap").hidden = !p.titles.length;
      $("d-desc").value = p.description;
      $("d-desc-wrap").hidden = !p.description;
      $("d-script").value = p.script;
      $("d-credits").textContent = p.image_credits.length ? `사진·영상 출처: ${p.image_credits.join(", ")}` : "";
      $("detail").hidden = false;
      history.replaceState(null, "", `?id=${id}`);
    } catch (err) {
      showError("열지 못했어요: " + err.message);
    }
  }

  $("d-copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText($("d-desc").value); } catch { $("d-desc").select(); document.execCommand("copy"); }
    $("d-copy").textContent = "복사했어요";
    setTimeout(() => { $("d-copy").textContent = "설명란 복사"; }, 1500);
  });
  $("d-delete").addEventListener("click", async () => {
    if (!current || !confirm(`'${current.title}'을(를) 보관함에서 지울까요? 되돌릴 수 없어요.`)) return;
    try {
      await api(`/api/v1/projects/${encodeURIComponent(current.project_id)}`, { method: "DELETE" });
      current = null;
      $("detail").hidden = true;
      $("d-video").removeAttribute("src");
      history.replaceState(null, "", location.pathname);
      loadList();
    } catch (err) { showError("지우지 못했어요: " + err.message); }
  });
  // 서명된 링크는 일정 시간 뒤 만료됩니다. 재생이 실패하면 새 링크를 받아 다시 엽니다.
  $("d-video").addEventListener("error", () => { if (current && !$("d-video").dataset.retried) { $("d-video").dataset.retried = "1"; openDetail(current.project_id); } });
  $("d-video").addEventListener("loadeddata", () => { delete $("d-video").dataset.retried; });
  $("key-save").addEventListener("click", () => {
    try { localStorage.setItem(API_KEY_STORAGE, $("api-key").value.trim()); } catch {}
    loadList();
  });

  loadList();
})();
</script>
</body>
</html>
