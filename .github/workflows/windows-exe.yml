name: Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --noconfirm packaging/shorts.spec

      - name: Add FFmpeg and guide
        shell: pwsh
        run: |
          $zip = "ffmpeg.zip"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-7.1.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath ffmpeg-src
          $bin = Get-ChildItem ffmpeg-src -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force dist/AI-Shorts/ffmpeg | Out-Null
          Copy-Item $bin.FullName, (Join-Path $bin.DirectoryName "ffprobe.exe") dist/AI-Shorts/ffmpeg/
          $lic = Get-ChildItem ffmpeg-src -Recurse -Filter LICENSE.txt | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName dist/AI-Shorts/ffmpeg/LICENSE.txt }
          Copy-Item packaging/README-windows.txt "dist/AI-Shorts/사용법.txt"

      - name: Smoke test
        working-directory: dist/AI-Shorts
        run: |
          ./AI-Shorts.exe --smoke-test
          ./ffmpeg/ffmpeg.exe -hide_banner -version
          Remove-Item .env

      - name: Zip
        run: Compress-Archive -Path dist/AI-Shorts -DestinationPath AI-Shorts-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Shorts-windows
          path: AI-Shorts-windows.zip

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete windows-latest --cleanup-tag -y || true
          gh release create windows-latest AI-Shorts-windows.zip \
            --target "$GITHUB_SHA" \
            --title "Windows 실행 파일 (최신)" \
            --notes "AI-Shorts-windows.zip을 받아 압축을 풀고 AI-Shorts.exe를 실행하세요. 자세한 내용은 압축 안의 사용법.txt를 보세요."
