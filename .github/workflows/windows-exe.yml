name: Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 같은 릴리스를 동시에 지우고 만들지 않도록 한 번에 하나씩 실행합니다.
concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --noconfirm packaging/shorts.spec

      - name: Add FFmpeg and guide
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 정식 릴리스 빌드(n버전) 중 가장 최신 것을 받습니다. 파일 이름이 버전마다 바뀌어 패턴으로 찾습니다.
          gh release download latest -R BtbN/FFmpeg-Builds -p "ffmpeg-n*-latest-win64-gpl-[0-9]*.zip" -D ffmpeg-zips
          $zip = Get-ChildItem ffmpeg-zips -Filter *.zip | Where-Object Name -match "-gpl-[0-9.]+\.zip$" |
            Sort-Object { [version]($_.Name -replace '.*-gpl-([0-9.]+)\.zip$', '$1') } |
            Select-Object -Last 1
          Write-Host "FFmpeg: $($zip.Name)"
          Expand-Archive $zip.FullName -DestinationPath ffmpeg-src
          $bin = Get-ChildItem ffmpeg-src -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force dist/AI-Shorts/ffmpeg | Out-Null
          Copy-Item $bin.FullName, (Join-Path $bin.DirectoryName "ffprobe.exe") dist/AI-Shorts/ffmpeg/
          $lic = Get-ChildItem ffmpeg-src -Recurse -Filter LICENSE.txt | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName dist/AI-Shorts/ffmpeg/LICENSE.txt }
          Copy-Item packaging/README-windows.txt "dist/AI-Shorts/사용법.txt"

      - name: Smoke test
        working-directory: dist/AI-Shorts
        run: |
          ./AI-Shorts.exe --smoke-test
          ./ffmpeg/ffmpeg.exe -hide_banner -version
          Remove-Item .env

      - name: Zip
        run: Compress-Archive -Path dist/AI-Shorts -DestinationPath AI-Shorts-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Shorts-windows
          path: AI-Shorts-windows.zip

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete windows-latest --cleanup-tag -y || true
          gh release create windows-latest AI-Shorts-windows.zip scripts/install-windows.bat \
            --target "$GITHUB_SHA" \
            --title "Windows 실행 파일 (최신)" \
            --notes "install-windows.bat을 받아 더블클릭하면 D:\\AI-Shorts에 설치하고 바탕화면 바로가기를 만듭니다 (업데이트도 같은 파일). 직접 하려면 AI-Shorts-windows.zip을 받아 압축을 풀고 AI-Shorts.exe를 실행하세요."

      - name: Test installer
        if: github.ref == 'refs/heads/main'
        shell: cmd
        env:
          AI_SHORTS_NO_PROMPT: "1"
        run: |
          call scripts\install-windows.bat || exit /b 1
          D:\AI-Shorts\AI-Shorts.exe --smoke-test || exit /b 1
          powershell -NoProfile -Command "if (-not (Test-Path ([Environment]::GetFolderPath('Desktop')+'\AI-Shorts.lnk'))) { exit 1 }"
